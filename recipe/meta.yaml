{% set name = "hookee" %}
{% set version = "3.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2fad9cf3a2caaa0efb3e8f463d8e2eb18cf24fbee0d9be09b51e7726fef8340d

build:
  noarch: python
  entry_points:
    - hookee=hookee.cli:hookee
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - pluginbase >=1.0.1
    - confuse >=2.1.0
    - typing_extensions >=4.16.0
    - flask >=3.1.3
    - click >=8.1.8
    - pyngrok >=9.0.0
    - defusedxml >=0.7.1

test:
  imports:
    - hookee
  commands:
    - pip check
    - hookee --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/alexdlaird/hookee
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Command line webhooks, on demand: see, answer, forward, and capture requests from your terminal"
  description: |
    hookee gives you a public URL to your terminal with one command. Point any service's webhooks at it, then see,
    answer, and forward every request as it happens, with no code.
  doc_url: https://hookee.readthedocs.io/
  dev_url: https://github.com/alexdlaird/hookee

extra:
  recipe-maintainers:
    - alexdlaird
